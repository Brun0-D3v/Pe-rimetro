server:
  port: 8080

spring:
  application:
    name: perimetro-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:perimetro}
    username: ${DB_USER:perimetro}
    password: ${DB_PASSWORD:perimetro}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      accept-float-as-int: false
  flyway:
    enabled: true
    locations: classpath:db/migration

perimetro:
  jwt:
    segredo: ${JWT_SECRET:}
    expiracao: PT2H
  admin:
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
  cors:
    origens-permitidas: ${FRONTEND_URL:http://localhost:5173,http://localhost:5174}
